name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - name: Manifest matches the Makefile
        run: python3 tools/check-repos.py
      - name: Makefile targets resolve
        run: make -n help clone link status check fmt >/dev/null
